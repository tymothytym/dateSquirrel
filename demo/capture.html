<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dateSquirrel — capture stage</title>
    <style>
      /*
       * A bare stage for `npm run gif`. No headings, no cards, nothing but one
       * picker on a transparent background, at a fixed size so successive runs
       * produce identical frames.
       */
      /*
       * Opaque background, deliberately. GIF alpha is 1-bit and its frame
       * disposal rules make partially transparent animations flicker; opaque
       * frames sidestep both. These match GitHub's readme canvas so the GIF
       * blends in, and the encoder ships one file per scheme.
       */
      html,
      body {
        margin: 0;
        background: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0d1117;
        }
      }

      #stage {
        width: 420px;
        padding: 22px;
        /* Slower than the shipped default so a screenshot burst gets plenty of
           frames through the slide. Playback delay is set by the encoder, so
           this only affects how densely the motion is sampled. */
        --dsq-duration: 450ms;
      }

      /* Slightly tighter rows keep the GIF a sensible height. */
      #stage .dsq {
        --dsq-row-height: 2.25rem;
        --dsq-radius: 6px;
      }

      #stage.theme-pink .dsq {
        --dsq-primary: #b4185d;
        --dsq-focus: #a4114f;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <input id="field" placeholder="Pick a date" />
    </div>
    <script type="module" src="./capture.ts"></script>
  </body>
</html>
